<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voluntários e vínculos - Plantão Clima</title>
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu"></div>
<main class="container py-3">
  <div id="avisos"></div>
  <h1>Voluntários e vínculos</h1>
  <p class="text-body-secondary">Voluntários são pessoas que o idoso já conhece. Cada idoso precisa de um titular e um reserva.</p>

  <div id="furos"></div>

  <div class="row g-4">
    <section class="col-12 col-lg-6">
      <form id="formVol" class="card card-body" novalidate>
        <h2 id="tituloVol" class="h5">Novo voluntário</h2>
        <input type="hidden" name="id">
        <div class="row g-3">
          <div class="col-12"><label class="form-label" for="nome">Nome *</label>
            <input class="form-control" id="nome" name="nome" maxlength="80" autocomplete="off"></div>
          <div class="col-12 col-md-6"><label class="form-label" for="telefone">Celular (DDD + número) *</label>
            <input class="form-control" id="telefone" name="telefone" inputmode="tel" placeholder="11987654321"></div>
          <div class="col-6 col-md-3"><label class="form-label" for="tipo">Quem é *</label>
            <select class="form-select" id="tipo" name="tipo">
              <option value="VIZINHO">Vizinho</option><option value="FAMILIAR">Familiar</option><option value="SINDICO">Síndico</option>
              <option value="IGREJA">Igreja</option><option value="ACS">Agente de saúde</option><option value="OUTRO">Outro</option></select></div>
          <div class="col-6 col-md-3"><label class="form-label" for="idRegiaoVol">Região *</label>
            <select class="form-select" id="idRegiaoVol" name="idRegiao"></select></div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" type="submit">Salvar</button>
          <button class="btn btn-outline-secondary" type="button" id="limparVol">Limpar</button>
        </div>
      </form>
      <h2 class="h5 mt-4">Voluntários</h2>
      <div id="listaVol"></div>
    </section>

    <section class="col-12 col-lg-6">
      <form id="formVinc" class="card card-body" novalidate>
        <h2 class="h5">Ligar idoso a voluntário</h2>
        <div class="row g-3">
          <div class="col-12"><label class="form-label" for="idIdoso">Idoso *</label>
            <select class="form-select" id="idIdoso" name="idIdoso"></select></div>
          <div class="col-12 col-md-8"><label class="form-label" for="idVoluntario">Voluntário *</label>
            <select class="form-select" id="idVoluntario" name="idVoluntario"></select></div>
          <div class="col-12 col-md-4"><label class="form-label" for="papel">Papel *</label>
            <select class="form-select" id="papel" name="papel"><option value="TITULAR">Titular</option><option value="RESERVA">Reserva</option></select></div>
        </div>
        <button class="btn btn-primary mt-3" type="submit">Criar vínculo</button>
      </form>
      <h2 class="h5 mt-4">Vínculos</h2>
      <div id="listaVinc"></div>
    </section>
  </div>
</main>

<script src="lib/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
const formVol = document.getElementById('formVol'), formVinc = document.getElementById('formVinc');
const TIPOS = { VIZINHO: 'Vizinho', FAMILIAR: 'Familiar', SINDICO: 'Síndico', IGREJA: 'Igreja', ACS: 'Agente de saúde', OUTRO: 'Outro' };
let voluntarios = [];

async function carregar() {
  const regioes = await tentar(() => api('regioes'));
  if (!regioes) return;
  opcoes(document.getElementById('idRegiaoVol'), regioes, 'id', r => `${r.nome} (${r.cidade})`, 'Escolha...');
  const [vols, idosos, vincs, furos] = await Promise.all([api('voluntarios'), api('idosos'), api('vinculos'), api('relatorios/furos')]);
  voluntarios = vols;
  const nomeRegiao = id => (regioes.find(r => r.id === id) || {}).nome || '';
  opcoes(document.getElementById('idIdoso'), idosos, 'id', i => i.nome, 'Escolha o idoso...');
  opcoes(document.getElementById('idVoluntario'), vols, 'id', v => `${v.nome} (${TIPOS[v.tipo]})`, 'Escolha o voluntário...');

  document.getElementById('furos').innerHTML = furos.length ? `<div class="alert alert-warning">
    <strong>Rede incompleta:</strong> ${furos.map(f => `${esc(f.idoso)} (${f.cuidadores_ativos} de 2)`).join(', ')}.
    Sem reserva, quando o titular não consegue falar, o idoso já vira crítico.</div>` : '';

  document.getElementById('listaVol').innerHTML = vols.length ? `<div class="table-responsive"><table class="table table-striped align-middle">
    <thead><tr><th>Nome</th><th>Quem é</th><th>Telefone</th><th>Região</th><th>Ações</th></tr></thead><tbody>
    ${vols.map(v => `<tr><td>${esc(v.nome)}</td><td>${TIPOS[v.tipo]}</td><td>${esc(v.telefone)}</td><td>${esc(nomeRegiao(v.idRegiao))}</td>
      <td><div class="d-flex flex-wrap gap-1"><button class="btn btn-sm btn-outline-primary" onclick="editar(${v.id})">Editar</button>
      <button class="btn btn-sm btn-outline-danger" onclick="desativar(${v.id}, this)">Desativar</button></div></td></tr>`).join('')}
    </tbody></table></div>` : '<p>Nenhum voluntário.</p>';

  document.getElementById('listaVinc').innerHTML = vincs.length ? `<div class="table-responsive"><table class="table table-striped align-middle">
    <thead><tr><th>Idoso</th><th>Voluntário</th><th>Papel</th><th>Ações</th></tr></thead><tbody>
    ${vincs.map(v => `<tr><td>${esc(v.idoso)}</td><td>${esc(v.voluntario)}</td>
      <td><span class="badge text-bg-${v.papel === 'TITULAR' ? 'primary' : 'info'}">${v.papel === 'TITULAR' ? 'Titular' : 'Reserva'}</span></td>
      <td class="text-nowrap"><button class="btn btn-sm btn-outline-primary" onclick="trocar(${v.id_idoso}, ${v.id_voluntario}, '${v.papel}')">Trocar papel</button>
      <button class="btn btn-sm btn-outline-danger" onclick="remover(${v.id_idoso}, ${v.id_voluntario})">Remover</button></td></tr>`).join('')}
    </tbody></table></div>` : '<p>Nenhum vínculo.</p>';
}

function limparVol() {
  formVol.reset();
  formVol.elements.id.value = '';
  document.getElementById('tituloVol').textContent = 'Novo voluntário';
  limparErros(formVol);
}

function editar(id) {
  preencherForm(formVol, voluntarios.find(v => v.id === id));
  document.getElementById('tituloVol').textContent = 'Editando voluntário';
  formVol.scrollIntoView({ behavior: 'smooth' });
}

async function desativar(id, botao) {
  if (botao.dataset.confirmar !== 'sim') {
    botao.dataset.confirmar = 'sim';
    botao.textContent = 'Confirmar?';
    return;
  }
  if (await tentar(() => api('voluntarios/excluir', { id }), 'Voluntário desativado e removido dos vínculos.') !== undefined) carregar();
}

async function trocar(idIdoso, idVoluntario, papel) {
  const r = await tentar(() => api('vinculos/papel', { idIdoso, idVoluntario, papel: papel === 'TITULAR' ? 'RESERVA' : 'TITULAR' }), 'Papel trocado.');
  if (r) carregar();
}

async function remover(idIdoso, idVoluntario) {
  const r = await tentar(() => api('vinculos/excluir', { idIdoso, idVoluntario }), 'Vínculo removido.');
  if (r) carregar();
}

formVol.addEventListener('submit', async e => {
  e.preventDefault();
  limparErros(formVol);
  const d = dadosForm(formVol);
  d.telefone = soDigitos(d.telefone);
  let ok = true;
  if (d.nome.length < 2) ok = erroCampo(formVol, 'nome', 'Informe o nome (mínimo 2 letras).');
  if (!/^\d{10,11}$/.test(d.telefone)) ok = erroCampo(formVol, 'telefone', 'Use DDD + número (10 ou 11 dígitos).');
  if (!d.idRegiao) ok = erroCampo(formVol, 'idRegiao', 'Escolha a região.');
  if (!ok) return;
  const r = await tentar(() => api('voluntarios', d), d.id ? 'Voluntário atualizado.' : 'Voluntário cadastrado.');
  if (r) { limparVol(); carregar(); }
});

formVinc.addEventListener('submit', async e => {
  e.preventDefault();
  limparErros(formVinc);
  const d = dadosForm(formVinc);
  let ok = true;
  if (!d.idIdoso) ok = erroCampo(formVinc, 'idIdoso', 'Escolha o idoso.');
  if (!d.idVoluntario) ok = erroCampo(formVinc, 'idVoluntario', 'Escolha o voluntário.');
  if (!ok) return;
  const r = await tentar(() => api('vinculos', d), 'Vínculo criado.');
  if (r) carregar();
});
document.getElementById('limparVol').addEventListener('click', limparVol);
carregar();
</script>
</body>
</html>
