<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idosos - Plantão Clima</title>
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu"></div>
<main class="container py-3">
  <div id="avisos"></div>
  <h1>Idosos acompanhados</h1>
  <p class="text-body-secondary">Pessoas de 60 anos ou mais que moram sozinhas. Só cadastre com consentimento da pessoa ou do responsável.</p>

  <form id="form" class="card card-body mb-4" novalidate>
    <h2 id="titulo" class="h5">Novo idoso</h2>
    <input type="hidden" name="id">
    <div class="row g-3">
      <div class="col-12 col-md-6"><label class="form-label" for="nome">Nome *</label>
        <input class="form-control" id="nome" name="nome" maxlength="80" autocomplete="off"></div>
      <div class="col-6 col-md-3"><label class="form-label" for="anoNascimento">Ano de nascimento *</label>
        <input class="form-control" id="anoNascimento" name="anoNascimento" type="number" inputmode="numeric"></div>
      <div class="col-6 col-md-3"><label class="form-label" for="idRegiao">Região *</label>
        <select class="form-select" id="idRegiao" name="idRegiao"></select></div>
      <div class="col-12 col-md-6"><label class="form-label" for="telefone">Celular (DDD + número)</label>
        <input class="form-control" id="telefone" name="telefone" inputmode="tel" placeholder="11987654321"></div>
      <div class="col-12 col-md-6"><label class="form-label" for="telefoneFixo">Telefone fixo (DDD + número)</label>
        <input class="form-control" id="telefoneFixo" name="telefoneFixo" inputmode="tel" placeholder="1133334444"></div>
      <div class="col-12 col-md-2"><label class="form-label" for="cep">CEP</label>
        <input class="form-control" id="cep" inputmode="numeric" maxlength="9" autocomplete="postal-code" aria-describedby="cepAjuda"></div>
      <div class="col-12 col-md-4"><label class="form-label" for="enderecoRef">Endereço / referência</label>
        <input class="form-control" id="enderecoRef" name="enderecoRef" maxlength="120">
        <div id="cepAjuda" class="form-text" role="status">Digite o CEP: rua e bairro entram sozinhos. Complete com número e uma referência.</div></div>
      <div class="col-12 col-md-6"><label class="form-label" for="contatoFamiliar">Contato da família (nome e telefone)</label>
        <input class="form-control" id="contatoFamiliar" name="contatoFamiliar" maxlength="80"></div>
      <fieldset class="col-12">
        <legend class="form-label fs-6">Situação (define o risco no calor e na chuva)</legend>
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check"><input class="form-check-input" type="checkbox" id="moraSozinho" name="moraSozinho" checked><label class="form-check-label" for="moraSozinho">Mora sozinho(a)</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="condicaoCronica" name="condicaoCronica"><label class="form-check-label" for="condicaoCronica">Doença crônica</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="semVentilacao" name="semVentilacao"><label class="form-check-label" for="semVentilacao">Casa sem ventilação</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="mobilidadeReduzida" name="mobilidadeReduzida"><label class="form-check-label" for="mobilidadeReduzida">Mobilidade reduzida</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="areaRisco" name="areaRisco"><label class="form-check-label" for="areaRisco">Mora em área de risco (encosta, córrego, alagamento)</label></div>
        </div>
      </fieldset>
      <div class="col-6 col-md-3"><label class="form-label" for="consentimentoEm">Consentimento em *</label>
        <input class="form-control" id="consentimentoEm" name="consentimentoEm" type="date"></div>
      <div class="col-6 col-md-3"><label class="form-label" for="consentidoPor">Quem consentiu *</label>
        <select class="form-select" id="consentidoPor" name="consentidoPor">
          <option value="PROPRIO">A própria pessoa</option><option value="RESPONSAVEL">Responsável</option></select></div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <button class="btn btn-outline-secondary" type="button" id="cancelar">Limpar</button>
    </div>
  </form>

  <h2 class="h5">Cadastrados</h2>
  <div id="lista"></div>
</main>

<script src="lib/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
const form = document.getElementById('form');
let regioes = [], idosos = [];

function validar(d) {
  limparErros(form);
  let ok = true;
  const ano = new Date().getFullYear();
  if (d.nome.length < 2) ok = erroCampo(form, 'nome', 'Informe o nome (mínimo 2 letras).');
  if (!/^\d{4}$/.test(d.anoNascimento) || d.anoNascimento < 1900 || d.anoNascimento > ano) ok = erroCampo(form, 'anoNascimento', 'Ano inválido.');
  else if (ano - d.anoNascimento < 60) ok = erroCampo(form, 'anoNascimento', 'O Plantão Clima atende pessoas com 60 anos ou mais.');
  if (!d.idRegiao) ok = erroCampo(form, 'idRegiao', 'Escolha a região.');
  d.telefone = soDigitos(d.telefone);
  d.telefoneFixo = soDigitos(d.telefoneFixo);
  if (!d.telefone && !d.telefoneFixo) ok = erroCampo(form, 'telefone', 'Informe ao menos um telefone (celular ou fixo).');
  if (d.telefone && !/^\d{10,11}$/.test(d.telefone)) ok = erroCampo(form, 'telefone', 'Use DDD + número (10 ou 11 dígitos).');
  if (d.telefoneFixo && !/^\d{10}$/.test(d.telefoneFixo)) ok = erroCampo(form, 'telefoneFixo', 'Fixo: DDD + número (10 dígitos).');
  if (!d.consentimentoEm || d.consentimentoEm > hoje()) ok = erroCampo(form, 'consentimentoEm', 'Informe a data do consentimento (não pode ser futura).');
  return ok;
}

async function carregar() {
  regioes = await tentar(() => api('regioes'));
  if (!regioes) return;
  opcoes(document.getElementById('idRegiao'), regioes, 'id', r => `${r.nome} (${r.cidade})`, 'Escolha...');
  idosos = await api('idosos');
  const nomeRegiao = id => (regioes.find(r => r.id === id) || {}).nome || '';
  document.getElementById('lista').innerHTML = idosos.length ? `<div class="table-responsive"><table class="table table-striped align-middle">
    <thead><tr><th>Nome</th><th>Idade</th><th>Região</th><th>Telefone</th><th>Risco calor</th><th>Risco chuva</th><th>Ações</th></tr></thead><tbody>
    ${idosos.map(i => `<tr><td>${esc(i.nome)}</td><td>${i.idade}</td><td>${esc(nomeRegiao(i.idRegiao))}</td>
      <td>${esc([i.telefone, i.telefoneFixo].filter(Boolean).join(' / '))}</td>
      <td>${badgeRisco(i.riscoCalor)}</td><td>${badgeRisco(i.riscoChuva)}</td>
      <td class="text-nowrap"><button class="btn btn-sm btn-outline-primary" onclick="editar(${i.id})">Editar</button>
        <button class="btn btn-sm btn-outline-danger" onclick="desativar(${i.id}, this)">Desativar e anonimizar</button></td></tr>`).join('')}
    </tbody></table></div>` : '<p>Nenhum idoso cadastrado.</p>';
}

function limpar() {
  form.reset();
  form.elements.id.value = '';
  form.elements.consentimentoEm.value = hoje();
  document.getElementById('titulo').textContent = 'Novo idoso';
  limparErros(form);
}

function editar(id) {
  preencherForm(form, idosos.find(i => i.id === id));
  document.getElementById('titulo').textContent = 'Editando idoso';
  form.scrollIntoView({ behavior: 'smooth' });
}

// dois cliques para confirmar (sem confirm() do navegador)
async function desativar(id, botao) {
  if (botao.dataset.confirmar !== 'sim') {
    botao.dataset.confirmar = 'sim';
    botao.textContent = 'Clique de novo para confirmar';
    return;
  }
  if (await tentar(() => api('idosos/excluir', { id }), 'Idoso desativado. Nome, telefones, endereço e saúde foram apagados (LGPD).') !== undefined) carregar();
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const d = dadosForm(form);
  if (!validar(d)) return;
  const r = await tentar(() => api('idosos', d), d.id ? 'Idoso atualizado.' : 'Idoso cadastrado.');
  if (r) { limpar(); carregar(); }
});
document.getElementById('cancelar').addEventListener('click', limpar);
limpar();
carregar();
// CEP pela BrasilAPI (publica, sem chave): preenche rua e bairro; o CEP nao e gravado
document.getElementById('cep').addEventListener('input', async e => {
  const cep = soDigitos(e.target.value), ajuda = document.getElementById('cepAjuda');
  if (cep.length !== 8) return;
  ajuda.textContent = 'Buscando o CEP';
  try {
    const r = await fetch('https://brasilapi.com.br/api/cep/v2/' + cep);
    if (!r.ok) throw new Error();
    const c = await r.json();
    const end = document.getElementById('enderecoRef');
    end.value = [c.street, c.neighborhood].filter(Boolean).join(', ') + ', ';
    end.focus();
    ajuda.textContent = `Achado: ${c.city}/${c.state}. Complete com número e uma referência.`;
  } catch (err) {
    ajuda.textContent = 'CEP não encontrado ou sem internet. Digite o endereço.';
  }
});
</script>
</body>
</html>
